name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes from CHANGELOG
        run: |
          TAG=${GITHUB_REF_NAME}
          VER=${GITHUB_REF_NAME#v}   # CHANGELOG guna [1.2.3] tanpa 'v'
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$VER" -v tagv="$TAG" '
              ($0 ~ "## \\[" tagv || $0 ~ "## \\[" tag) {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md > release_notes.md
            [ -s release_notes.md ] || echo "Release $TAG" > release_notes.md
          else
            echo "Release $TAG" > release_notes.md
          fi

      - name: Build plugin zip
        run: |
          SLUG="woo-live-sales-fomo"
          # Distributable plugin zip: everything except repo-only files.
          zip -r -q "${SLUG}.zip" . -x './.git/*' -x './.github/*' -x './.gitignore'
          unzip -l "${SLUG}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: true
          files: woo-live-sales-fomo.zip
